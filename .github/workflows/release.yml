name: Release
on:
  push:
    branches: ['release/v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/build.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release branch and source version
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_REF" != release/v* ]]; then
            echo "Use release/vSEMVER" >&2
            exit 1
          fi
          version="${RELEASE_REF#release/v}"
          python tools/package.py --expected-version "$version"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          if git rev-parse --verify "refs/tags/v$version" >/dev/null 2>&1; then
            actual="$(git rev-parse "refs/tags/v$version^{commit}")"
            if [[ "$actual" != "$GITHUB_SHA" ]]; then
              echo "Existing tag points to another commit; refusing publication" >&2
              exit 1
            fi
          fi
      - name: Publish versioned archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          notes_file="$RUNNER_TEMP/release-notes.md"
          python tools/release_notes.py --tag "$RELEASE_TAG" --output "$notes_file"
          flags+=(--notes-file "$notes_file")
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 "${flags[@]}" \
            --target "$GITHUB_SHA" --title "ModCoreTemplates $RELEASE_TAG"
